<!DOCTYPE html>
<html>
<head>
  <title>Cart</title>
  <link rel="stylesheet" href="css/cart.css">
 
</head>
<body>
 

  <!-- HTML for cart page -->
<table>
  <thead>
    <tr>
      <th>Product</th>
      <th>Quantity</th>
      <th>Price</th>
      <th>Total</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Sneaker 1</td>
      <td>
        <input type="number" value="1" min="1" data-product-id="sneaker1">
      </td>
      <td>$100</td>
      <td>$100</td>
      <td>
        <button data-product-id="sneaker1">Remove</button>
      </td>
    </tr>
    <tr>
      <td>Sneaker 2</td>
      <td>
        <input type="number" value="2" min="1" data-product-id="sneaker2">
      </td>
      <td>$120</td>
      <td>$240</td>
      <td>
        <button data-product-id="sneaker2">Remove</button>
      </td>
    </tr>
    <tr>
      <td>Sandal 1</td>
      <td>
        <input type="number" value="1" min="1" data-product-id="sandal1">
      </td>
      <td>$80</td>
      <td>$80</td>
      <td>
        <button data-product-id="sandal1">Remove</button>
      </td>
    </tr>
    <tr>
      <td colspan="3">Total:</td>
      <td colspan="2">$420</td>
    </tr>
  </tbody>
</table>
<button id="checkout-button">Checkout</button>
